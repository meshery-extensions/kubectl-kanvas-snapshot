name: Kanvas Snapshot Build & Release

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'meshery-extensions/kubectl-kanvas-snapshot' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'patch') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser with tag
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 2
          args: release --clean --skip validate -f .goreleaser.yml
        env:
          RELEASE_CHANNEL: "stable"
          PROVIDER_TOKEN: ${{ secrets.PROVIDER_TOKEN }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
