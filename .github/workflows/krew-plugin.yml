name: Build Krew Plugin Manifest

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    pull-requests: write
    actions: read

jobs:
    build_krew_plugin:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.25.3"

            - name: Build binaries
              run: |
                  mkdir -p dist

                  # macOS Intel (amd64)
                  echo "Building for macOS Intel..."
                  GOOS=darwin GOARCH=amd64 go build -o dist/plugin-name
                  tar czf dist/plugin-name-darwin-amd64.tar.gz -C dist plugin-name
                  rm dist/plugin-name

                  # macOS Apple Silicon (arm64)
                  echo "Building for macOS ARM64..."
                  GOOS=darwin GOARCH=arm64 go build -o dist/plugin-name
                  tar czf dist/plugin-name-darwin-arm64.tar.gz -C dist plugin-name
                  rm dist/plugin-name

                  # Linux Intel (amd64)
                  echo "Building for Linux Intel..."
                  GOOS=linux GOARCH=amd64 go build -o dist/plugin-name
                  tar czf dist/plugin-name-linux-amd64.tar.gz -C dist plugin-name
                  rm dist/plugin-name

                  # Linux ARM (arm64)
                  echo "Building for Linux ARM64..."
                  GOOS=linux GOARCH=arm64 go build -o dist/plugin-name
                  tar czf dist/plugin-name-linux-arm64.tar.gz -C dist plugin-name
                  rm dist/plugin-name

                  # Windows Intel (amd64)
                  echo "Building for Windows..."
                  GOOS=windows GOARCH=amd64 go build -o dist/plugin-name.exe
                  cd dist && zip plugin-name-windows-amd64.zip plugin-name.exe && cd ..
                  rm dist/plugin-name.exe

            - name: Calculate SHA256 checksums
              run: |
                  cd dist
                  sha256sum * > checksums.txt
                  cat checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
